spring.application.name=LedgerAPIGateway
server.port=8100

#spring.threads.virtual.enabled=true
spring.cloud.gateway.server.webmvc.routes[0].id=account
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/ledger/account/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=AddRequestHeader=X-Gateway, default-gateway


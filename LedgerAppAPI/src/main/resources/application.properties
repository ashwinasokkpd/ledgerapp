spring.application.name=LedgerAppAPI
spring.config.import=optional:file:.env[.properties]


server.port=${PORT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

fillwithdummyusers=false


#spring.threads.virtual.enabled=true
spring.cloud.gateway.server.webmvc.routes[0].id=account
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/ledger/account/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=AddRequestHeader=X-Gateway, default-gateway

spring.cloud.gateway.server.webmvc.routes[1].id=transfer
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/ledger/transfer/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=AddRequestHeader=X-Gateway, default-gateway

spring.cloud.gateway.server.webmvc.routes[2].id=transaction
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/ledger/transaction/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[2].filters[1]=AddRequestHeader=X-Gateway, default-gateway
